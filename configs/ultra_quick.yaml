# Configuração ULTRA-RÁPIDA com image_size=128 — resultado em ~3 minutos
model:
  in_channels: 3
  base_channels: 32
  depth: 3          # depth=3 para image_size=128 (bottleneck = 16x16)
  deep_supervision: false
  dropout_p: 0.1

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 99
  seed: 42

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  pos_weight: null

data:
  image_size: 128    # 4x menos pixels que 256 → 4x mais rápido
  train_samples: 500
  val_samples: 50
  line_thickness_px: 2
  num_workers: 0

inference:
  threshold: 0.5
  tile_size: 128
  overlap_fraction: 0.25
